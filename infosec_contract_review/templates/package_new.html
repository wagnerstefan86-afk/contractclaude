{% extends "base.html" %}
{% block title %}Neues Vertragspaket – InfoSec Contract Review{% endblock %}
{% block content %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/ui/">Pakete</a></li>
        <li class="breadcrumb-item active">Neues Paket</li>
    </ol>
</nav>

<h2>Neues Vertragspaket anlegen</h2>

<form method="post" action="/ui/packages/new" class="mt-3" style="max-width: 600px;">
    <div class="mb-3">
        <label for="name" class="form-label">Paketname *</label>
        <input type="text" class="form-control" id="name" name="name" required placeholder="z.B. Rahmenvertrag IT-Services 2026">
    </div>
    <div class="mb-3">
        <label for="customer_name" class="form-label">Kundenname</label>
        <input type="text" class="form-control" id="customer_name" name="customer_name" placeholder="optional">
    </div>
    <div class="mb-3">
        <label for="description" class="form-label">Beschreibung</label>
        <textarea class="form-control" id="description" name="description" rows="3" placeholder="optional"></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Anlegen</button>
    <a href="/ui/" class="btn btn-outline-secondary ms-2">Abbrechen</a>
</form>
{% endblock %}
