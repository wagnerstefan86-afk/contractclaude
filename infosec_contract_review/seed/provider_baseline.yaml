baseline:
  version: "1.0"
  valid_from: "2026-01-01"

  certifications:
    - standard: "ISO 27001"
      scope: "Managed Services, Workplace, RZ-Betrieb"
      valid_until: "2027-06-30"
      covers_all_services: false
      excluded_services:
        - "Hardware-Resale"
        - "Lizenzverkauf"

  standard_positions:
    audit_rights:
      accepted: >
        1x jährlich, über Auftraggeber koordiniert, 20 Werktage Vorlaufzeit,
        während Geschäftszeiten, Kosten nach Aufwand
      not_accepted: >
        Direkte Endkunden-Audits, jederzeitige Prüfung ohne Anlass,
        kostenfreie Bereitstellung
      escalation_threshold: >
        Drittaudits ohne Mandantenschutz und ohne Kostentragung

    incident_reporting:
      accepted: >
        24h Erstmeldung, 72h qualifizierter Bericht,
        30 Tage Abschlussbericht
      not_accepted: >
        4h Root-Cause-Analyse, Echtzeit-Benachrichtigung bei jedem Event
      escalation_threshold: >
        Meldepflichten die faktisch einen 24/7-CSIRT voraussetzen,
        wenn nicht bepreist

    bcm_itscm:
      accepted: >
        RTO/RPO dokumentiert und testiert, jährlicher BCM-Test,
        Ergebnisse auf Anfrage verfügbar
      not_accepted: >
        Keine dokumentierten RTO/RPO, kein Nachweis über BCM-Tests
      escalation_threshold: >
        Fehlende BCM-Dokumentation bei kritischen Services mit SLA >= 99.5%

    sla_feasibility:
      accepted: >
        Verfügbarkeit <= 99.9%, Wartungsfenster explizit ausgenommen,
        Messmethodik definiert, Vertragsstrafen gedeckelt
      not_accepted: >
        Verfügbarkeit >= 99.99% ohne Wartungsfenster-Ausnahme,
        unbegrenzte Vertragsstrafen, transaktionsbasierte Messung
      escalation_threshold: >
        SLA >= 99.95% ohne DR-Suspension-Klausel oder ohne
        definierte Messmethodik

    certifications:
      accepted: >
        ISO 27001 oder SOC 2 Type II für Kernservices,
        Rezertifizierung alle 3 Jahre, Scope umfasst Vertragsgegenstand
      not_accepted: >
        Keine Zertifizierung, nur Self-Assessment, Scope deckt
        Vertragsgegenstand nicht ab
      escalation_threshold: >
        Fehlende Zertifizierung bei regulierten Services oder
        bei expliziter vertraglicher Anforderung

  service_profiles:
    - service_type: managed_service
      delivery_model: shared
      tenant_model: multi_tenant
      baseline_controls:
        - isms
        - patch_management
        - vulnerability_scanning
        - backup
        - monitoring
        - incident_process

    - service_type: workplace
      delivery_model: shared
      tenant_model: multi_tenant
      baseline_controls:
        - endpoint_protection
        - patch_management
        - mobile_device_management
        - data_loss_prevention
        - incident_process

    - service_type: hardware_resale
      delivery_model: transactional
      tenant_model: not_applicable
      baseline_controls:
        - secure_supply_chain
        - hardware_lifecycle_management
