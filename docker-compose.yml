services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: contract_review
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d contract_review"]
      interval: 3s
      timeout: 3s
      retries: 10

  bootstrap:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/contract_review
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./infosec_contract_review/seed:/app/infosec_contract_review/seed:ro
    command: ["bash", "entrypoint.sh"]

  backend:
    build: .
    command: uvicorn infosec_contract_review.app:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/contract_review
      UPLOAD_DIR: /app/uploads
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./infosec_contract_review:/app/infosec_contract_review
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
